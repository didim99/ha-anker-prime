              - padding-left: 8px
              - font-size: 12px
              - white-space: nowrap
              - color: '[[[ return variables.color ]]]'
            electrical:
              - justify-self: start
              - font-size: 12px
              - white-space: nowrap
              - color: var(--secondary-text-color)
              - font-variant-numeric: tabular-nums
            energy:
              - justify-self: end
              - font-size: 12px
              - white-space: nowrap
              - color: var(--secondary-text-color)
              - font-variant-numeric: tabular-nums
            bar:
              - margin-top: 8px
      - type: custom:button-card
        entity: sensor.250w_prime_a2_power
        name: A2
        icon: mdi:usb-port
        show_state: false
        triggers_update:
          - sensor.250w_prime_a2_status
          - sensor.250w_prime_a2_voltage
          - sensor.250w_prime_a2_current
          - sensor.250w_prime_a2_energy
          - switch.250w_prime_usb_a_output
        variables:
          sensor: sensor.250w_prime_a2
          output: switch.250w_prime_usb_a_output
          max_power: 22.5
          # Shared by the styles below: charging, active, idle, off or offline.
          mode: |
            [[[
              const st = states[variables.sensor + '_status'];
              const out = states[variables.output];
              if (!st || ['unknown', 'unavailable'].includes(st.state))
                return 'offline';
              if (out && out.state === 'off') return 'off';
              return st.state;
            ]]]
          color: |
            [[[
              return {charging: 'var(--success-color)',
                       active: 'var(--warning-color)',
                       off: 'var(--error-color)'}[variables.mode]
                || 'var(--disabled-color)';
            ]]]
        tap_action:
          action: more-info
        hold_action:
          action: more-info
          entity: switch.250w_prime_usb_a_output
        custom_fields:
          watts: |
            [[[
              const s = entity;
              if (!s || isNaN(parseFloat(s.state))) return '—';
              return parseFloat(s.state).toFixed(1) + ' W';
            ]]]
          status: |
            [[[
              if (variables.mode === 'offline') return 'Offline';
              if (variables.mode === 'off') return 'Output off';
              return hass.formatEntityState(states[variables.sensor + '_status']);
            ]]]
          electrical: |
            [[[
              const value = (suffix, unit) => {
                const s = states[variables.sensor + suffix];
                if (!s || isNaN(parseFloat(s.state))) return '—';
                return parseFloat(s.state).toFixed(2) + '\u00a0' + unit;
              };
              return value('_voltage', 'V') + ' · ' + value('_current', 'A');
            ]]]
          energy: |
            [[[
              const s = states[variables.sensor + '_energy'];
              if (!s || isNaN(parseFloat(s.state))) return '—';
              return parseFloat(s.state).toFixed(2) + '\u00a0Wh';
            ]]]
          bar: |
            [[[
              const watts = parseFloat(entity ? entity.state : NaN) || 0;
              const share = Math.min(100, watts / variables.max_power * 100);
              return `<div style="height: 4px; border-radius: 2px;
                        background: var(--divider-color); overflow: hidden">
                        <div style="width: ${share}%; height: 100%;
                          background: ${variables.color};
                          transition: width 0.6s ease"></div></div>`;
            ]]]
        styles:
          card:
            - padding: 12px 14px 10px
            - border-left: '[[[ return "4px solid " + variables.color ]]]'
            - opacity: >-
                [[[ return variables.mode === 'offline' ? 0.55 : 1 ]]]
          grid:
            - grid-template-areas: >-
                "i n status watts" "i electrical electrical energy"
                "bar bar bar bar"
            - grid-template-columns: 30px auto 1fr auto
            - grid-template-rows: auto auto auto
            - column-gap: 10px
            - row-gap: 2px
          img_cell:
            - justify-content: start
            - align-items: center
            - width: 30px
          icon:
            - width: 26px
            - color: '[[[ return variables.color ]]]'
          name:
            - justify-self: start
            - font-weight: 600
            - font-size: 15px
          custom_fields:
            watts:
              - justify-self: end
              - font-size: 17px
              - font-weight: 600
              - white-space: nowrap
              - font-variant-numeric: tabular-nums
            status:
              - justify-self: start
              - align-self: center
              - padding-left: 8px
              - font-size: 12px
              - white-space: nowrap
              - color: '[[[ return variables.color ]]]'
            electrical:
              - justify-self: start
              - font-size: 12px
              - white-space: nowrap
              - color: var(--secondary-text-color)
              - font-variant-numeric: tabular-nums
            energy:
              - justify-self: end
              - font-size: 12px
              - white-space: nowrap
              - color: var(--secondary-text-color)
              - font-variant-numeric: tabular-nums
            bar:
              - margin-top: 8px
