# The hardware suite runs on its own: `pytest hardware` from the repository
# root picks this file up instead of pyproject.toml. Home Assistant's test
# plugin and its socket block are off, in case they are installed.
[pytest]
addopts = --strict-markers --strict-config -p no:cacheprovider
    -p no:homeassistant -p no:socket
asyncio_default_fixture_loop_scope = session
